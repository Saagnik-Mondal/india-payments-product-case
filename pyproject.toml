[project]
name = "india-payments-product-case"
version = "0.2.0"
description = "A product case study on India's digital payments, built from PhonePe's open Pulse data (SQL on DuckDB)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
